AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Data-query integration: an HTTP API + a Lambda tool that returns records via
  the RDS Data API, its Bearer-token secret, the Lambda IAM, and the execution
  role for a Bedrock AgentCore assistant. All resource names are parameters
  (defaults are the real names) so the same template can deploy a parallel,
  fully tracked copy in the same account/region. The database is NOT created here.

# ---------------------------------------------------------------------------
# DEPLOY (easiest path) — with the SAM CLI:
#     sam deploy --guided
#
# Or WITHOUT the SAM CLI (the Serverless transform runs server-side):
#     aws cloudformation deploy \
#       --template-file template.yaml \
#       --stack-name data-query \
#       --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
#       --parameter-overrides ApiToken=<your-token> \
#                             DbClusterArn=<aurora-cluster-arn> \
#                             DbSecretArn=<db-credentials-secret-arn> \
#                             DbName=companydb
#
# The stack Outputs print the public endpoint. Test:
#     curl -X POST "<ApiUrl>" -H "Authorization: Bearer <your-token>"
#
# The DATABASE IS NOT CREATED HERE — bring your own data source (an existing
# Aurora cluster reachable by the RDS Data API), or leave the Db* params empty
# to deploy the API/Lambda skeleton first.
# ---------------------------------------------------------------------------

Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: "Bearer token clients must send it in the Authorization header as: Bearer <token>."

  # ---- Resource names (parameterized; defaults are the real production names) ----
  LambdaFunctionName:
    Type: String
    Default: lambda-saludo
    Description: >
      Name of the data-query Lambda tool. Default is the REAL name the assistant
      invokes by (kept for compatibility). Override for a parallel copy.
  ApiName:
    Type: String
    Default: data-query-api
  TokenSecretName:
    Type: String
    Default: query-api-token
  AssistantRoleName:
    Type: String
    Default: data-assistant-exec
  ProjectTag:
    Type: String
    Default: data-query
    Description: Value of the "Project" tag applied to every resource, for tracking.

  # ---- Data source (NOT created here) ----
  DbClusterArn:
    Type: String
    Default: ""
    Description: >
      ARN of the Aurora cluster the Lambda queries via the RDS Data API.
      Leave empty to deploy without a data source (queries will error until set).
  DbSecretArn:
    Type: String
    Default: ""
    Description: ARN of the Secrets Manager secret with the DB credentials (used by the RDS Data API).
  DbName:
    Type: String
    Default: companydb
    Description: Logical database name to query.

  # ---- Bedrock AgentCore assistant ----
  DeployAgent:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Whether to create the Bedrock AgentCore runtime. Requires bedrock-agentcore
      permissions and an existing container image (see AgentImageUri). Set to
      "false" to deploy only the serverless layer (API + Lambda + secret + IAM).
  AgentImageUri:
    Type: String
    Default: 780817326479.dkr.ecr.us-east-1.amazonaws.com/agente-saludo:latest
    Description: >
      ECR URI of the assistant's container image. The image is a build artifact,
      not created by this template; build/push it with the AgentCore starter
      toolkit (agentcore launch) or keep the existing one. The image invokes the
      Lambda tool by the name in LambdaFunctionName, so keep them consistent.
  AgentRuntimeName:
    Type: String
    Default: data_assistant
    Description: Name of the AgentCore runtime (letters, digits, underscore).
  AgentProtocol:
    Type: String
    Default: HTTP
    AllowedValues: ["MCP", "HTTP", "A2A", "AGUI"]
  AgentNetworkMode:
    Type: String
    Default: PUBLIC
    AllowedValues: ["PUBLIC", "VPC"]

Conditions:
  HasDbCluster: !Not [!Equals [!Ref DbClusterArn, ""]]
  HasDbSecret: !Not [!Equals [!Ref DbSecretArn, ""]]
  WithAgent: !Equals [!Ref DeployAgent, "true"]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Architectures: [x86_64]
    Tags:
      Project: !Ref ProjectTag
      ManagedBy: cloudformation

Resources:

  # --- Bearer token used by the HTTP path (validated inside the Lambda) ---
  QueryApiToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref TokenSecretName
      Description: Bearer token for the HTTP query endpoint.
      SecretString: !Sub '{"token":"${ApiToken}"}'
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: ManagedBy, Value: cloudformation }

  # --- HTTP API (data-query-api) ---
  QueryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Ref ApiName
      StageName: $default
      # Auth is enforced inside the Lambda (Bearer token). No gateway authorizer.
      Tags:
        Project: !Ref ProjectTag
        ManagedBy: cloudformation

  # --- The data-query Lambda tool (shared by the HTTP API and the assistant) ---
  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Handler: index.lambda_handler
      Environment:
        Variables:
          DB_CLUSTER_ARN: !Ref DbClusterArn
          DB_SECRET_ARN: !Ref DbSecretArn
          DB_NAME: !Ref DbName
          TOKEN_SECRET: !Ref QueryApiToken   # secret ARN; GetSecretValue accepts an ARN
      Policies:
        - Statement:
            - Sid: DataAPI
              Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              # Scoped to the cluster when provided; "*" is a placeholder until you set DbClusterArn.
              Resource: !If [HasDbCluster, !Ref DbClusterArn, "*"]
            - Sid: ReadTokenSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref QueryApiToken
            - !If
              - HasDbSecret
              - Sid: ReadDbSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn
              - !Ref AWS::NoValue
      Events:
        Query:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueryApi
            Path: /products     # SAM requires a literal path here (no intrinsics)
            Method: ANY
      InlineCode: |
        import json
        import os
        import boto3

        # Company data lookup via the RDS Data API (HTTPS, no VPC, no driver).
        REGION = os.environ.get("AWS_REGION", "us-east-1")
        CLUSTER_ARN = os.environ.get("DB_CLUSTER_ARN", "")
        DB_SECRET_ARN = os.environ.get("DB_SECRET_ARN", "")
        DB_NAME = os.environ.get("DB_NAME", "companydb")
        TOKEN_SECRET = os.environ["TOKEN_SECRET"]

        rds_data = boto3.client("rds-data", region_name=REGION)
        secrets_client = boto3.client("secretsmanager", region_name=REGION)


        def list_products():
            """Business logic: return the product list. Shared by the assistant and the HTTP API."""
            resp = rds_data.execute_statement(
                resourceArn=CLUSTER_ARN,
                secretArn=DB_SECRET_ARN,
                database=DB_NAME,
                sql="SELECT name FROM products ORDER BY name",
            )
            return [col[0].get("stringValue") for col in resp.get("records", [])]


        def valid_token(received):
            secret = secrets_client.get_secret_value(SecretId=TOKEN_SECRET)
            return received == json.loads(secret["SecretString"])["token"]


        def lambda_handler(event, context):
            is_http = "headers" in event and event.get("requestContext", {}).get("http") is not None

            if is_http:
                # From API Gateway -> validate the bearer token
                headers = event.get("headers", {}) or {}
                auth = headers.get("authorization") or headers.get("Authorization", "")
                received = auth.replace("Bearer ", "").strip()
                if not received or not valid_token(received):
                    return {"statusCode": 401, "body": json.dumps({"error": "Missing or invalid token"})}
                return {
                    "statusCode": 200,
                    "headers": {"Content-Type": "application/json"},
                    "body": json.dumps({"products": list_products()}),
                }

            # Direct invocation (assistant/LLM) -> access already enforced by IAM.
            return {"products": list_products()}

  # --- Execution role for the Bedrock AgentCore assistant (the agent uses this) ---
  # The agent invokes the Lambda tool directly (IAM) and calls a Bedrock model.
  AssistantExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AssistantRoleName
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: ManagedBy, Value: cloudformation }
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-tool-and-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeQueryTool
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt QueryFunction.Arn
              - Sid: InvokeModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: PullAgentImage
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetAuthorizationToken
                Resource: "*"

  # --- The Bedrock AgentCore runtime (the assistant) ---
  # Runs the agent CONTAINER IMAGE (AgentImageUri). The image is a build artifact,
  # NOT created by this template: build/push it with the AgentCore starter toolkit
  # (`agentcore launch`) or keep the existing one. Creating this resource requires
  # bedrock-agentcore permissions; set DeployAgent=false to skip it.
  # The image invokes the Lambda tool BY NAME (LambdaFunctionName) — that is why
  # the default is kept as the real name the image was built against.
  AssistantRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: WithAgent
    Properties:
      AgentRuntimeName: !Ref AgentRuntimeName
      RoleArn: !GetAtt AssistantExecutionRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref AgentImageUri
      NetworkConfiguration:
        NetworkMode: !Ref AgentNetworkMode
      ProtocolConfiguration: !Ref AgentProtocol

Outputs:
  ApiUrl:
    Description: Public endpoint for the HTTP query path.
    Value: !Sub "https://${QueryApi}.execute-api.${AWS::Region}.amazonaws.com/products"
  FunctionName:
    Description: Name of the data-query Lambda tool.
    Value: !Ref QueryFunction
  FunctionArn:
    Description: ARN of the data-query Lambda tool (use it as the assistant's tool).
    Value: !GetAtt QueryFunction.Arn
  TokenSecretArn:
    Description: ARN of the Bearer-token secret.
    Value: !Ref QueryApiToken
  AssistantExecutionRoleArn:
    Description: Execution role the AgentCore runtime assumes (invoke Lambda + Bedrock).
    Value: !GetAtt AssistantExecutionRole.Arn
  AgentRuntimeArn:
    Condition: WithAgent
    Description: ARN of the Bedrock AgentCore runtime.
    Value: !GetAtt AssistantRuntime.AgentRuntimeArn
